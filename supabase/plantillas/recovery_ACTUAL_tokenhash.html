<div style="margin:0;padding:0;background:#f7f5f2;font-family:Arial,sans-serif;color:#1a1a1a;">
  <div style="max-width:560px;margin:0 auto;padding:40px 24px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="display:inline-block;background:#e8763a;border-radius:16px;padding:14px 18px;">
        <div style="width:28px;height:28px;border:3px solid #0d0d0d;border-radius:999px;">
          <div style="width:10px;height:10px;background:#0d0d0d;border-radius:999px;margin:9px 0 0 9px;"></div>
        </div>
      </div>
      <div style="margin-top:16px;font-size:28px;font-weight:700;letter-spacing:4px;">AURA.</div>
    </div>

    <div style="background:#ffffff;border-radius:24px;padding:32px 28px;box-shadow:0 10px 30px rgba(0,0,0,0.06);">
      <div style="font-size:28px;font-weight:700;line-height:1.2;margin-bottom:12px;">
        Recuperá tu acceso
      </div>

      <div style="font-size:16px;line-height:1.6;color:#5f5a56;margin-bottom:24px;">
        Recibimos un pedido para cambiar tu contraseña.
        Si fuiste vos, seguí este paso para crear una nueva.
      </div>

      <div style="text-align:center;margin:32px 0;">
        <a href="https://somosaurapass.com/#/reset-password?token_hash={{ .TokenHash }}&type=recovery"
           style="display:inline-block;background:#e8763a;color:#0d0d0d;text-decoration:none;font-weight:700;font-size:16px;padding:16px 28px;border-radius:14px;">
          Cambiar contraseña
        </a>
      </div>

      <div style="font-size:14px;line-height:1.6;color:#8a837d;">
        El link vale por 24 horas y se usa una sola vez.
        Si no pediste este cambio, podés ignorar este mail.
      </div>
    </div>

    <div style="text-align:center;font-size:12px;color:#9b948d;margin-top:20px;line-height:1.6;">
      Mové. Explorá. Viví.
    </div>
  </div>
</div>
